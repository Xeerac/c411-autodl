name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Vérification de la syntaxe
        run: python -m py_compile c411_autodl.py
      - name: Tests (aucun accès réseau, tout est simulé)
        run: python -m unittest discover -s tests -v
      - name: Scripts shell
        if: runner.os == 'Linux'
        run: bash -n lancer_h24.sh && bash -n installer_service.sh && bash -n migrer_vers_docker.sh

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t c411-autodl:test .
      - name: Le programme démarre dans le conteneur
        run: docker run --rm c411-autodl:test --version
      - name: L'image ne contient ni .env ni données
        run: |
          docker run --rm --entrypoint sh c411-autodl:test -c 'test ! -e /app/.env && test -z "$(ls -A /app/donnees)" && whoami'
      - name: Configuration d'exemple valide
        run: docker compose config --quiet
