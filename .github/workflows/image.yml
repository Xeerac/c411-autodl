name: Image Docker

# Publie l'image sur GitHub (ghcr.io/xeerac/c411-autodl) à chaque version (tag v1.2.3).
# Étiquettes : 1.2.3, 1.2 et latest. Architectures : amd64 (PC, VPS) et arm64 (Raspberry Pi, serveurs ARM).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/xeerac/c411-autodl

jobs:
  publier:
    name: Construction et publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests avant publication
        run: |
          python3 -m pip install -q -r requirements-interface.txt httpx
          python3 -m unittest discover -s tests

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch

      - name: Construction (amd64) et vérification avant publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: c411-autodl:verif

      - name: L'image démarre et ne contient ni .env ni données
        run: |
          docker run --rm c411-autodl:verif --version
          docker run --rm --entrypoint sh c411-autodl:verif -c \
            'test ! -e /app/.env && test -z "$(ls -A /app/donnees)" && test "$(id -u)" = 1000'

      - name: Publication (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
