# Lancement de c411-autodl avec Docker :
#   cp .env.example .env        puis remplis-le
#   mkdir -p donnees
#   docker compose up -d --build
#   docker compose logs c411-autodl | grep "code d'installation"
# Puis ouvre l'interface web par un tunnel SSH sur le port 8411 (voir le README).
#
# Tu as déjà un docker-compose.yml (cross-seed, Prowlarr…) ? Copie simplement le bloc « c411-autodl »
# dedans, en adaptant les chemins de « build » et « volumes ».

services:
  c411-autodl:
    build: .
    image: c411-autodl:local
    container_name: c411-autodl
    # Utilisateur qui possède le dossier donnees/ et le fichier .env (commande « id » pour connaître le tien)
    user: "1000:1000"
    # Interface web + moteur. Sans interface (comme en v1) : command: ["--boucle", "300"] et retire « ports ».
    command: ["--interface", "--hote", "0.0.0.0", "--port", "8411"]
    ports:
      # Accessible uniquement depuis la machine : on y accède par un tunnel SSH, jamais depuis Internet
      - "127.0.0.1:8411:8411"
    volumes:
      - ./.env:/app/.env:ro
      - ./donnees:/app/donnees
    environment:
      - TZ=Europe/Paris
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
