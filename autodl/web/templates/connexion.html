{% extends "_auth_layout.html" %}
{% block title %}Connexion · c411-autodl{% endblock %}
{% block card %}
<h1>Connexion</h1>
<p class="muted">Content de te revoir.</p>
{% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/connexion" class="form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field">
    <label class="field-label" for="f-user">Nom d'utilisateur</label>
    <input id="f-user" name="utilisateur" required value="{{ utilisateur or '' }}" autocomplete="username" autofocus>
  </div>
  <div class="field">
    <label class="field-label" for="f-pass">Mot de passe</label>
    <input id="f-pass" name="mot_de_passe" type="password" required autocomplete="current-password">
  </div>
  <button class="btn btn-primary btn-block" type="submit" {% if locked %}disabled{% endif %}>Se connecter</button>
</form>
{% endblock %}
