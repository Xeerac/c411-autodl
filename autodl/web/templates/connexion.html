{% extends "_auth_layout.html" %}
{% block title %}Connexion · c411-autodl{% endblock %}
{% block card %}
<h1>Connexion</h1>
{% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/connexion" class="form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="field">
    <span>Nom d'utilisateur</span>
    <input name="utilisateur" required value="{{ utilisateur or '' }}" autocomplete="username" autofocus>
  </label>
  <label class="field">
    <span>Mot de passe</span>
    <input name="mot_de_passe" type="password" required autocomplete="current-password">
  </label>
  <button class="btn btn-primary btn-block" type="submit" {% if locked %}disabled{% endif %}>Se connecter</button>
</form>
{% endblock %}
