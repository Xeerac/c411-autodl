<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  {% if csrf %}<meta name="csrf" content="{{ csrf }}">{% endif %}
  <title>{% block title %}c411-autodl{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='logo.svg') }}?v={{ version }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v={{ version }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
